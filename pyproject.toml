[project]
name = "sokkia-sdl-processor"
version = "0.1.0"
description = "Download level data from a Sokkia SDL50 and produce a level report"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sdlproc = "sdlproc.cli:main"

[project.gui-scripts]
sdlproc-gui = "sdlproc.gui:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdlproc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
